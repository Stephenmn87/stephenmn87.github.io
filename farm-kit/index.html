<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Farm Kit</title>
<style>
:root{--bg:#3f7a35;--pill:rgba(255,255,255,.88);--pill-text:#2b2b2b;--card:#fff;--btn:#e4e4e4;--btn-text:#222;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2d5a27;--pill:rgba(30,30,30,.85);--pill-text:#f2f2f2;--card:#2a2a2a;--btn:#444;--btn-text:#f2f2f2}}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}
#hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);background:var(--pill);color:var(--pill-text);font:600 14px system-ui,sans-serif;padding:8px 14px;border-radius:999px;transition:opacity .6s;pointer-events:none}
#menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
#menu .card{background:var(--card);color:var(--pill-text);width:min(320px,100%);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;font:16px system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#hud{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 52px);background:var(--pill);color:var(--pill-text);font:600 13px system-ui,sans-serif;padding:8px 14px;border:0;border-radius:999px;pointer-events:auto}
#mbtn{position:fixed;right:6px;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);width:36px;height:36px;border-radius:50%;border:0;background:var(--pill);color:var(--pill-text);font:20px system-ui,sans-serif;line-height:1;padding:0}
#menu .hd{display:flex;justify-content:space-between;align-items:center}
#menu button.x{padding:6px 12px;font-size:18px;line-height:1}
#menu .row{display:flex;justify-content:space-between;align-items:center;font-size:16px}
#menu input[type=checkbox]{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:var(--btn);position:relative;margin:0;transition:background .2s}
#menu input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
#menu input[type=checkbox]:checked{background:#2e7d32}
#menu input[type=checkbox]:checked::after{left:23px}
#menu h2{margin:0;font-size:20px}
#menu p{margin:0 0 6px;opacity:.75;font-size:14px}
#menu button{font:600 16px system-ui,sans-serif;padding:14px;border-radius:12px;border:0;background:var(--btn);color:var(--btn-text)}
#menu button.primary{background:#2e7d32;color:#fff}
#menu button:disabled{opacity:.45}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Tap anywhere to drive the tractor</div>
<button id="hud">📋 Status</button>
<button id="mbtn" aria-label="Menu">☰</button>
<div id="menu"><div class="card" id="barnCard"><h2>Barn</h2><p>Hitch machinery to your tractor</p><button id="bAtt" class="primary">Attach tiller</button><button id="bSeed" class="primary">Attach seed drill</button><button id="bHarv" class="primary">Attach harvester</button><button id="bRem">Remove all attachments</button><button id="bClose">Close</button></div><div class="card" id="storeCard" style="display:none"><h2>Seed store</h2><p>Choose seed to load into the drill</p><button id="bPot" class="primary">Potatoes</button><button id="bPum" class="primary">Pumpkins</button><button id="bClr">Clear selection</button><button id="bSClose">Close</button></div><div class="card" id="statusCard" style="display:none"><div class="hd"><h2>Status</h2><button class="x" id="stX">✕</button></div><div class="row"><span>Carrying</span><b id="stCar">🥔 0 🎃 0</b></div><div class="row"><span>Stored</span><b id="stSto">🥔 0 🎃 0</b></div></div><div class="card" id="gameCard" style="display:none"><div class="hd"><h2>Menu</h2><button class="x" id="gmX">✕</button></div><label class="row"><span>Seasons</span><input type="checkbox" id="seasonsOn" checked></label><button id="bReset">Reset field</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr,fieldH,m,bg,u,bounds,rad,fenceY,trees=[],fence=[],till,tg,walls=[],attach=null,menuOpen=false,barn={},store={},F,cell,cols,rows,tilledA,cropAt,crops=[],clock=0,seed=null,food={},load={potato:0,pumpkin:0},stored={potato:0,pumpkin:0},fxs=[],water=[],mill={x:0,y:0,r:1},bgs=[],bseason=0,pal,tpal,season=0,seasonT=0,seasonDur=60+Math.random()*20,fade=1,noteT=0,parts=[],prevS=0,seasonsOn=true;
const tractor={x:0,y:0,a:0,wr:0};let target=null,pulse=0,stall=0;

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function tree(g,x,y,r){
  g.fillStyle='rgba(0,0,0,.22)';g.beginPath();g.arc(x+r*.25,y+r*.3,r,0,7);g.fill();
  g.fillStyle=tpal[0];g.beginPath();g.arc(x,y,r,0,7);g.fill();
  g.fillStyle=tpal[1];g.beginPath();g.arc(x-r*.15,y-r*.15,r*.75,0,7);g.fill();
  g.fillStyle=tpal[2];g.beginPath();g.arc(x-r*.3,y-r*.3,r*.38,0,7);g.fill();
  if(bseason===0){g.fillStyle='#f8c8dc';for(let k=0;k<5;k++){const a=k*1.7+x;g.beginPath();g.arc(x+Math.cos(a)*r*.6,y+Math.sin(a)*r*.6,r*.14,0,7);g.fill()}}
}

const PAL=[
  {grass:'#7ac75a',sp:['#6fba4f','#86d466'],yard:'#86cf66',water:'#52b0e0',bank:'#5a9a45',tree:['#4f9a3e','#6dbb52','#9ad56e']},
  {grass:'#6aa84f',sp:['#62a048','#74b257'],yard:'#7bb85c',water:'#4aa3d8',bank:'#4f7f3c',tree:['#2e6b2a','#3f8a37','#58a84a']},
  {grass:'#9a9a48',sp:['#8c8c3e','#a8a858'],yard:'#a3a352',water:'#4a8fba',bank:'#7a7a3a',tree:['#a7471a','#d9772a','#efb04a']},
  {grass:'#e4ecf0',sp:['#d5e0e6','#f4f8fa'],yard:'#eaf1f4',water:'#cfe8f5',bank:'#c3d0d6',tree:['#c3d0d6','#e3ecf0','#ffffff']}
];
const SL=['🌸 Spring','☀️ Summer','🍂 Autumn','❄️ Winter'];
const SM=['Spring has arrived','Summer has arrived','Autumn has arrived','Winter: the ground is frozen, so no planting or harvesting'];
const PC=['#f8c8dc','','#e0782a','#ffffff'],PN=[22,0,32,60];
function seasonLen(s){return s===3?15+Math.random()*10:60+Math.random()*20}
function updateSeason(dt){
  if(fade<1)fade=Math.min(1,fade+dt/2);
  if(!seasonsOn)return;seasonT+=dt;
  if(seasonT>=seasonDur){prevS=season;season=(season+1)%4;seasonT=0;seasonDur=seasonLen(season);fade=0}
}
function initParts(){parts=[];for(let i=0;i<60;i++)parts.push({x:Math.random()*W,y:Math.random()*H,v:20+Math.random()*30,s:Math.random()*6.28,r:1.5+Math.random()*2})}
function drawParts(dt){
  const n=PN[season];if(!n)return;
  ctx.fillStyle=PC[season];ctx.globalAlpha=.85;
  for(let i=0;i<n;i++){
    const p=parts[i];p.y+=p.v*dt*(season===3?1:.7);p.s+=dt*1.5;p.x+=Math.sin(p.s)*18*dt;
    if(p.y>H+5){p.y=-5;p.x=Math.random()*W}
    ctx.beginPath();
    if(season===3)ctx.arc(p.x,p.y,p.r,0,7);else ctx.ellipse(p.x,p.y,p.r*1.6,p.r,p.s,0,7);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawSnow(){
  const a=season===3?fade:prevS===3?1-fade:0;if(a<=0)return;
  ctx.save();ctx.globalAlpha=.96*a;ctx.fillStyle='#f4f8fb';ctx.beginPath();ctx.roundRect(F.x,F.y,F.w,F.h,8);ctx.fill();ctx.restore();
}
function build(){bgs=[];for(bseason=0;bseason<4;bseason++)buildOne();initParts()}
function buildOne(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  fieldH=H*2/3;m=Math.max(34,W*.09);u=Math.max(44,Math.min(70,W*.14));
  rad=u*.38;bounds={x0:rad,x1:W-rad,y0:rad,y1:H-rad};
  bg=document.createElement('canvas');bg.width=W*dpr;bg.height=H*dpr;
  bgs[bseason]=bg;pal=PAL[bseason];tpal=pal.tree;
  const g=bg.getContext('2d');g.scale(dpr,dpr);const R=rng(7);
  // grass
  g.fillStyle=pal.grass;g.fillRect(0,0,W,H);
  for(let i=0;i<W*H/260;i++){g.fillStyle=R()<.5?pal.sp[0]:pal.sp[1];g.fillRect(R()*W,R()*H,3,3)}
  // yard (bottom third)
  g.fillStyle=pal.yard;g.fillRect(0,fieldH,W,H-fieldH);
  // field
  const fx=m,fy=m,fw=W-2*m,fh=fieldH-fy-m*.9;
  g.fillStyle='#6b4423';g.beginPath();g.roundRect(fx-4,fy-4,fw+8,fh+8,10);g.fill();
  g.save();g.beginPath();g.roundRect(fx,fy,fw,fh,8);g.clip();
  g.fillStyle='#8d5b2f';g.fillRect(fx,fy,fw,fh);
  const row=Math.max(16,W*.05);
  for(let x=fx,i=0;x<fx+fw;x+=row,i++){
    g.fillStyle=i%2?'#7d4f27':'#9a6736';g.fillRect(x,fy,row/2,fh);
    g.fillStyle='rgba(0,0,0,.12)';g.fillRect(x+row/2-2,fy,2,fh);
  }
  for(let i=0;i<fw*fh/90;i++){g.fillStyle='rgba(60,35,15,.35)';g.fillRect(fx+R()*fw,fy+R()*fh,2,2)}
  g.restore();
  // fence with gate gap
  const fyF=fieldH-m*.35,gate=u*1.6;
  g.strokeStyle='#d8c39a';g.lineWidth=3;
  fenceY=fyF;fence=[[m*.6,W/2-gate/2],[W/2+gate/2,W-m*.6]];fence.forEach(([a,b])=>{
    g.beginPath();g.moveTo(a,fyF);g.lineTo(b,fyF);g.stroke();
    for(let x=a;x<=b;x+=20){g.fillStyle='#b99a62';g.fillRect(x-2,fyF-7,4,14)}
  });
  // gravel lane
  g.fillStyle='#c9b88f';g.beginPath();g.roundRect(W/2-gate/2,fyF,gate,H-fyF,0);g.fill();
  const laneTop=fieldH+(H-fieldH)*.12;g.fillRect(0,laneTop,W,u*1.3);
  for(let i=0;i<400;i++){g.fillStyle=R()<.5?'#b8a77c':'#dccfae';g.fillRect(W/2-gate/2+R()*gate,fyF+R()*(H-fyF),2,2)}
  // canal between fence and road, with a bridge at the gate
  const cy0=fyF+10,cy1=laneTop-5,cyc=(cy0+cy1)/2,chh=(cy1-cy0)/2,bx0=W/2-gate/2;
  g.fillStyle=pal.bank;g.fillRect(0,cy0-3,W,cy1-cy0+6);
  g.fillStyle=pal.water;g.fillRect(0,cy0,W,cy1-cy0);
  g.fillStyle='rgba(255,255,255,.4)';
  for(let x=10,k=0;x<W;x+=34,k++)g.fillRect(x,cyc+(k%3-1)*3-1,12,2);
  g.fillStyle='#8b6b43';g.fillRect(bx0,cy0-4,gate,cy1-cy0+8);
  g.strokeStyle='rgba(50,30,10,.45)';g.lineWidth=1;
  for(let y=cy0-2;y<cy1+4;y+=5){g.beginPath();g.moveTo(bx0,y);g.lineTo(bx0+gate,y);g.stroke()}
  g.fillStyle='#f4efe4';g.fillRect(bx0-3,cy0-4,5,cy1-cy0+8);g.fillRect(bx0+gate-2,cy0-4,5,cy1-cy0+8);
  water=[[0,cyc,bx0,cyc,chh],[bx0+gate,cyc,W,cyc,chh]];
  // future building plots
  g.setLineDash([8,6]);g.lineWidth=2;g.strokeStyle='rgba(255,255,255,.55)';
  const py=fieldH+(H-fieldH)*.12+u*1.3+14,ph=H-py-14,pw=(W-m*2-24)/3;
  for(let i=0;i<3;i++){g.beginPath();g.roundRect(m+i*(pw+12),py,pw,ph,10);g.stroke()}
  g.setLineDash([]);
  // barn (middle plot)
  const bx=m+pw+12,by=py,wt=9,st=16;
  barn={x:bx,y:by,w:pw,h:ph,wt};
  g.fillStyle='#a67c52';g.fillRect(bx,by,pw,ph);
  g.strokeStyle='rgba(60,35,15,.35)';g.lineWidth=1;
  for(let y=by+12;y<by+ph;y+=12){g.beginPath();g.moveTo(bx,y);g.lineTo(bx+pw,y);g.stroke()}
  g.fillStyle='rgba(60,35,15,.45)';g.font='700 '+Math.round(pw*.2)+'px system-ui,sans-serif';g.textAlign='center';g.fillText('BARN',bx+pw/2,by+ph*.55);
  g.fillStyle='#e0b84a';g.fillRect(bx+wt+2,by+ph-wt-16,18,14);g.fillRect(bx+pw-wt-20,by+ph-wt-16,18,14);
  const wr=(x,y,w,h)=>{g.fillStyle='#b23a2e';g.fillRect(x,y,w,h);g.strokeStyle='#6e1f18';g.lineWidth=2;g.strokeRect(x,y,w,h)};
  wr(bx,by,wt,ph);wr(bx+pw-wt,by,wt,ph);wr(bx,by+ph-wt,pw,wt);wr(bx,by,st,wt);wr(bx+pw-st,by,st,wt);
  walls=[[bx+wt/2,by,bx+wt/2,by+ph,wt/2],[bx+pw-wt/2,by,bx+pw-wt/2,by+ph,wt/2],[bx,by+ph-wt/2,bx+pw,by+ph-wt/2,wt/2],[bx,by+wt/2,bx+st,by+wt/2,wt/2],[bx+pw-st,by+wt/2,bx+pw,by+wt/2,wt/2]];
  // tilled-soil layer, clipped to the field
  till=document.createElement('canvas');till.width=W*dpr;till.height=H*dpr;
  tg=till.getContext('2d');tg.scale(dpr,dpr);tg.beginPath();tg.roundRect(fx,fy,fw,fh,8);tg.clip();
  mill={x:fx+fw-.85*u,y:fy+fh-.85*u,r:.8*u};
  // crop grid
  F={x:fx,y:fy,w:fw,h:fh};cell=Math.max(10,Math.round(u*.22));cols=Math.ceil(fw/cell);rows=Math.ceil(fh/cell);
  tilledA=new Uint8Array(cols*rows);cropAt=new Array(cols*rows).fill(null);crops=[];
  // food store (right plot)
  const fx2=m+2*(pw+12);food={x:fx2,y:py,w:pw,h:ph,wt};
  g.fillStyle='#d9c9a3';g.fillRect(fx2,py,pw,ph);
  g.strokeStyle='rgba(60,35,15,.3)';g.lineWidth=1;
  for(let y=py+12;y<py+ph;y+=12){g.beginPath();g.moveTo(fx2,y);g.lineTo(fx2+pw,y);g.stroke()}
  g.fillStyle='rgba(90,50,10,.45)';g.font='700 '+Math.round(pw*.2)+'px system-ui,sans-serif';g.textAlign='center';g.fillText('FOOD',fx2+pw/2,py+ph*.55);
  g.fillStyle='#a1724a';g.strokeStyle='#5d4037';g.lineWidth=1.5;
  for(const[ox,oy]of[[wt+2,ph-wt-18],[pw-wt-22,ph-wt-18],[wt+2,ph-wt-38]]){g.fillRect(fx2+ox,py+oy,20,16);g.strokeRect(fx2+ox,py+oy,20,16);g.beginPath();g.moveTo(fx2+ox,py+oy+8);g.lineTo(fx2+ox+20,py+oy+8);g.stroke()}
  const fw2=(x,y,w,h)=>{g.fillStyle='#c77d2e';g.fillRect(x,y,w,h);g.strokeStyle='#7a4512';g.lineWidth=2;g.strokeRect(x,y,w,h)};
  fw2(fx2,py,wt,ph);fw2(fx2+pw-wt,py,wt,ph);fw2(fx2,py+ph-wt,pw,wt);fw2(fx2,py,st,wt);fw2(fx2+pw-st,py,st,wt);
  walls.push([fx2+wt/2,py,fx2+wt/2,py+ph,wt/2],[fx2+pw-wt/2,py,fx2+pw-wt/2,py+ph,wt/2],[fx2,py+ph-wt/2,fx2+pw,py+ph-wt/2,wt/2],[fx2,py+wt/2,fx2+st,py+wt/2,wt/2],[fx2+pw-st,py+wt/2,fx2+pw,py+wt/2,wt/2]);
  // seed store (left plot)
  const sx=m;store={x:sx,y:py,w:pw,h:ph,wt};
  g.fillStyle='#b9a47c';g.fillRect(sx,py,pw,ph);
  g.strokeStyle='rgba(60,35,15,.3)';g.lineWidth=1;
  for(let y=py+12;y<py+ph;y+=12){g.beginPath();g.moveTo(sx,y);g.lineTo(sx+pw,y);g.stroke()}
  g.fillStyle='rgba(40,50,60,.45)';g.font='700 '+Math.round(pw*.17)+'px system-ui,sans-serif';g.textAlign='center';g.fillText('SEEDS',sx+pw/2,py+ph*.55);
  g.fillStyle='#e6d8b5';g.strokeStyle='#8a7a50';g.lineWidth=1.5;
  for(const[ox,oy]of[[wt+2,ph-wt-16],[pw-wt-20,ph-wt-16],[wt+2,ph-wt-32]]){g.beginPath();g.roundRect(sx+ox,py+oy,18,14,4);g.fill();g.stroke()}
  const sw=(x,y,w,h)=>{g.fillStyle='#2f6f8f';g.fillRect(x,y,w,h);g.strokeStyle='#17394d';g.lineWidth=2;g.strokeRect(x,y,w,h)};
  sw(sx,py,wt,ph);sw(sx+pw-wt,py,wt,ph);sw(sx,py+ph-wt,pw,wt);sw(sx,py,st,wt);sw(sx+pw-st,py,st,wt);
  walls.push([sx+wt/2,py,sx+wt/2,py+ph,wt/2],[sx+pw-wt/2,py,sx+pw-wt/2,py+ph,wt/2],[sx,py+ph-wt/2,sx+pw,py+ph-wt/2,wt/2],[sx,py+wt/2,sx+st,py+wt/2,wt/2],[sx+pw-st,py+wt/2,sx+pw,py+wt/2,wt/2]);
  // trees around the edge
  const ts=[];
  for(let x=-10;x<W+30;x+=m*.8)ts.push([x+R()*12,m*.45+R()*8,m*.42+R()*m*.18]);
  for(let y=m*1.2;y<H+20;y+=y<fieldH?m*.8:m*1.5){
    ts.push([m*.4+R()*8,y+R()*10,m*.4+R()*m*.18]);
    ts.push([W-m*.4-R()*8,y+R()*10,m*.4+R()*m*.18]);
  }
  trees=ts.filter(t=>!(t[1]+t[2]>laneTop&&t[1]-t[2]<laneTop+u*1.3));
  trees.sort((a,b)=>a[1]-b[1]).forEach(t=>tree(g,...t));
}

function drawTractor(){
  const t=tractor;ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.a);
  const rr=(x,y,w,h,r,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x*u,y*u,w*u,h*u,r*u);ctx.fill()};
  ctx.save();ctx.translate(u*.05,u*.06);ctx.globalAlpha=.25;
  rr(-.4,-.48,.8,.96,.08,'#000');ctx.restore();
  if(attach==='tiller'){
    rr(-.2,.3,.05,.3,.01,'#455a64');rr(.15,.3,.05,.3,.01,'#455a64');
    rr(-.36,.48,.72,.2,.04,'#546e7a');
    ctx.fillStyle='#ffb300';const sp2=Math.floor(t.wr/5)%2;
    for(let i=0;i<9;i++)ctx.fillRect((-.33+i*.082)*u,(.52+((i+sp2)%2)*.07)*u,.05*u,.06*u);
  }
  if(attach==='drill'){
    rr(-.2,.3,.05,.28,.01,'#455a64');rr(.15,.3,.05,.28,.01,'#455a64');
    rr(-.4,.5,.8,.2,.04,'#d84315');rr(-.37,.53,.74,.05,.02,'#ffcc80');
    if(seed){ctx.fillStyle=seed==='pumpkin'?'#f2e2a6':'#8d6e63';for(let i=0;i<7;i++){ctx.beginPath();ctx.arc((-.3+i*.1)*u,.62*u,.025*u,0,7);ctx.fill()}}
    ctx.strokeStyle='#37474f';ctx.lineWidth=1.5;const sa=t.wr/(.04*u);
    for(let i=0;i<8;i++){
      const cx=(-.35+i*.1)*u,cy=.76*u,r=.04*u;
      ctx.beginPath();ctx.moveTo(cx,.7*u);ctx.lineTo(cx,cy);ctx.stroke();
      ctx.fillStyle='#78909c';ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
      ctx.beginPath();ctx.moveTo(cx+Math.cos(sa)*r,cy+Math.sin(sa)*r);ctx.lineTo(cx-Math.cos(sa)*r,cy-Math.sin(sa)*r);ctx.stroke();
    }
  }
  if(attach==='harvest'){
    rr(-.2,.3,.05,.28,.01,'#455a64');rr(.15,.3,.05,.28,.01,'#455a64');
    rr(-.4,.5,.8,.22,.04,'#f9a825');rr(-.34,.54,.68,.14,.02,'#37474f');
    ctx.fillStyle='#ffd54f';const o2=(t.wr/u)%.1;
    for(let i=0;i<7;i++){const lx=-.34+((i*.1+o2)%.7);if(lx<=.31)ctx.fillRect(lx*u,.54*u,.03*u,.14*u)}
    ctx.fillStyle='#1c1c1c';ctx.beginPath();ctx.arc(-.4*u,.74*u,.05*u,0,7);ctx.arc(.4*u,.74*u,.05*u,0,7);ctx.fill();
  }
  rr(-.42,.06,.16,.42,.04,'#1c1c1c');rr(.26,.06,.16,.42,.04,'#1c1c1c');
  rr(-.34,-.42,.1,.2,.03,'#1c1c1c');rr(.24,-.42,.1,.2,.03,'#1c1c1c');
  ctx.fillStyle='#666';const o=t.wr/u;for(let i=0;i<4;i++){const ry=(.07+((i*.1+o)%.4))*u,fy=(-.42+((i*.05+o)%.2))*u;ctx.fillRect(-.42*u,ry,.16*u,2);ctx.fillRect(.26*u,ry,.16*u,2);ctx.fillRect(-.34*u,fy,.1*u,2);ctx.fillRect(.24*u,fy,.1*u,2)}
  rr(-.15,-.48,.3,.5,.06,'#2e7d32');
  rr(-.22,-.04,.44,.44,.06,'#43a047');
  rr(-.17,.02,.34,.32,.05,'#e8e8e8');rr(-.12,.07,.24,.22,.04,'#cfd8dc');
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(.08*u,-.3*u,.03*u,0,7);ctx.fill();
  ctx.fillStyle='#ffe082';ctx.beginPath();ctx.arc(-.1*u,-.47*u,.04*u,0,7);ctx.arc(.1*u,-.47*u,.04*u,0,7);ctx.fill();
  ctx.restore();
}

function drawTarget(){
  if(!target)return;
  const r=10+Math.sin(pulse*6)*3;
  ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(target.x,target.y,r,0,7);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(target.x,target.y,3,0,7);ctx.fill();
}

function push(t,x1,y1,x2,y2,r){
  const vx=x2-x1,vy=y2-y1,l=vx*vx+vy*vy;
  let s=l?((t.x-x1)*vx+(t.y-y1)*vy)/l:0;s=Math.max(0,Math.min(1,s));
  const cx=x1+vx*s,cy=y1+vy*s;let dx=t.x-cx,dy=t.y-cy;const d=Math.hypot(dx,dy),min=rad+r;
  if(d<min){if(d<1e-6){dx=0;dy=1}else{dx/=d;dy/=d}t.x=cx+dx*min;t.y=cy+dy*min}
}
function collide(t){
  for(let k=0;k<3;k++){
    for(const[tx,ty,tr]of trees)push(t,tx,ty,tx,ty,tr*.85);
    for(const[a,b]of fence)push(t,a,fenceY,b,fenceY,5);
    for(const w of walls)push(t,...w);
    for(const w of water)push(t,...w);
    push(t,mill.x,mill.y,mill.x,mill.y,mill.r*.95);
    t.x=Math.max(rad,Math.min(W-rad,t.x));t.y=Math.max(rad,Math.min(H-rad,t.y));
  }
}
const GL=[139,195,74],GD=[46,125,50],WB=[161,136,127];
function mix(a,b,t){return `rgb(${a[0]+(b[0]-a[0])*t|0},${a[1]+(b[1]-a[1])*t|0},${a[2]+(b[2]-a[2])*t|0})`}
function cellOf(x,y){
  if(x<F.x||y<F.y||x>=F.x+F.w||y>=F.y+F.h)return -1;
  if((x-mill.x)**2+(y-mill.y)**2<mill.r*mill.r)return -1;
  const cx=Math.floor((x-F.x)/cell),cy=Math.floor((y-F.y)/cell);
  return cx>=cols||cy>=rows?-1:cy*cols+cx;
}
function mark(x,y){const i=cellOf(x,y);if(i>=0)tilledA[i]=1}
function plantAt(){
  const t=tractor,qx=t.x-Math.sin(t.a)*.76*u,qy=t.y+Math.cos(t.a)*.76*u;
  for(let k=0;k<8;k++){
    const l=(-.35+k*.1)*u,i=cellOf(qx+Math.cos(t.a)*l,qy+Math.sin(t.a)*l);
    if(i>=0&&tilledA[i]&&!cropAt[i]){
      const c={cx:i%cols,cy:(i/cols)|0,t0:clock,type:seed,g:seed==='pumpkin'?45+Math.random()*15:30+Math.random()*15,jx:(Math.random()-.5)*3,jy:(Math.random()-.5)*3};
      cropAt[i]=c;crops.push(c);
    }
  }
}
function updateCrops(){
  for(let i=crops.length-1;i>=0;i--){
    const c=crops[i];
    if(clock-c.t0>=c.g+30){
      crops.splice(i,1);const idx=c.cy*cols+c.cx;cropAt[idx]=null;tilledA[idx]=0;
      tg.clearRect(F.x+c.cx*cell,F.y+c.cy*cell,cell,cell);
    }
  }
}
function drawPumpkin(c,age){
  const gd=c.g,x=F.x+(c.cx+.5)*cell+c.jx,y=F.y+(c.cy+.5)*cell+c.jy,p=Math.min(1,age/gd),w=age>gd+15?(age-gd-15)/15:0;
  const lr=cell*(.15+.3*p)*(1-.3*w),ac=(cx,cy,r)=>{ctx.moveTo(cx+r,cy);ctx.arc(cx,cy,r,0,7)};
  ctx.fillStyle=w?mix(GD,WB,w):mix(GL,GD,p);ctx.beginPath();
  ac(x-lr*.8,y+lr*.3,lr*.75);ac(x+lr*.8,y+lr*.3,lr*.75);ctx.fill();
  if(p>.35){
    const q=(p-.35)/.65,pr=cell*(.1+.4*q)*(1-.25*w);
    ctx.fillStyle=w?mix([239,125,26],WB,w):mix([124,179,66],[239,125,26],q);
    ctx.beginPath();ctx.ellipse(x,y,pr,pr*.85,0,0,7);ctx.fill();
    ctx.fillStyle='#3f7d2a';ctx.fillRect(x-1,y-pr*.85-2,2,3);
  }
}
function drawCrops(){
  for(const c of crops){
    const age=clock-c.t0,gd=c.g;if(c.type==='pumpkin'){drawPumpkin(c,age);continue}let rs,col,flower=false;
    if(age<gd){const p=age/gd;rs=.12+.34*p;col=mix(GL,GD,p)}
    else if(age<gd+15){rs=.46;col=mix(GD,GD,0);flower=true}
    else{const w=(age-gd-15)/15;rs=.46-.18*w;col=mix(GD,WB,w);flower=w<.3}
    const x=F.x+(c.cx+.5)*cell+c.jx,y=F.y+(c.cy+.5)*cell+c.jy,r=rs*cell;
    ctx.fillStyle=col;ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,7);
    ctx.moveTo(x-r*.6+r*.6,y+r*.3);ctx.arc(x-r*.6,y+r*.3,r*.6,0,7);
    ctx.moveTo(x+r*1.2,y+r*.3);ctx.arc(x+r*.6,y+r*.3,r*.6,0,7);
    ctx.fill();
    if(flower){ctx.fillStyle='#f3e5f5';ctx.beginPath();ctx.arc(x,y-r*.2,r*.25,0,7);ctx.fill()}
  }
}
function drawMill(){
  const x=mill.x,y=mill.y,r=mill.r;
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.arc(x+r*.08,y+r*.1,r,0,7);ctx.fill();
  ctx.fillStyle='#9a9a86';ctx.strokeStyle='#6d6d5c';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#f1ece0';ctx.beginPath();ctx.arc(x,y,r*.55,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#b23a2e';ctx.beginPath();ctx.arc(x,y,r*.42,0,7);ctx.fill();
  ctx.strokeStyle='#7e251c';ctx.lineWidth=1.5;
  for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*r*.42,y+Math.sin(a)*r*.42);ctx.stroke()}
}
function drawSails(){
  const L=mill.r*1.5;
  ctx.save();ctx.translate(mill.x,mill.y);ctx.rotate(clock*.6);
  for(let k=0;k<4;k++){
    ctx.save();ctx.rotate(k*Math.PI/2);
    ctx.fillStyle='rgba(245,238,220,.88)';ctx.strokeStyle='#5d4037';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.rect(L*.28,0,L*.72,L*.2);ctx.fill();ctx.stroke();
    for(let i=1;i<5;i++){const lx=L*.28+L*.72*i/5;ctx.beginPath();ctx.moveTo(lx,0);ctx.lineTo(lx,L*.2);ctx.stroke()}
    ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(L,0);ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle='#5d4037';ctx.beginPath();ctx.arc(0,0,mill.r*.12,0,7);ctx.fill();
  ctx.restore();
}
function pumpkin(x,y,s,a){
  ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);
  ctx.fillStyle='#ef7d1a';ctx.strokeStyle='#a84e0b';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.ellipse(0,0,s,s*.85,0,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-s*.35,-s*.7);ctx.quadraticCurveTo(-s*.5,0,-s*.35,s*.7);ctx.moveTo(s*.35,-s*.7);ctx.quadraticCurveTo(s*.5,0,s*.35,s*.7);ctx.stroke();
  ctx.fillStyle='#3f7d2a';ctx.fillRect(-1.5,-s*1.05,3,s*.35);ctx.restore();
}
function hudUpdate(){stCar.textContent='🥔 '+load.potato+' 🎃 '+load.pumpkin;stSto.textContent='🥔 '+stored.potato+' 🎃 '+stored.pumpkin}
function potato(x,y,s,a){
  ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.rotate(.4);
  ctx.fillStyle='#c9a15f';ctx.strokeStyle='#8d6a34';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.ellipse(0,0,s,s*.7,0,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#8d6a34';ctx.fillRect(-s*.4,-s*.1,2,2);ctx.fillRect(s*.2,s*.15,2,2);ctx.restore();
}
function drawFx(){
  for(let i=fxs.length-1;i>=0;i--){
    const f=fxs[i],p=(clock-f.t0)/f.life;
    if(p>=1){fxs.splice(i,1);continue}
    if(p<0)continue;
    const e=1-(1-p)*(1-p),a=p<.7?1:(1-p)/.3,y=f.y-(f.txt?40:70)*e;
    if(f.txt){
      ctx.globalAlpha=a;ctx.fillStyle='#fff';ctx.strokeStyle='#2b2b2b';ctx.lineWidth=3;
      ctx.font='700 20px system-ui,sans-serif';ctx.textAlign='center';
      ctx.strokeText(f.txt,f.x,y);ctx.fillText(f.txt,f.x,y);ctx.globalAlpha=1;
    }else(f.ty==='pumpkin'?pumpkin:potato)(f.x+f.dx*e,y,u*.13*Math.min(1,.4+p*8),a);
  }
}
function harvestAt(){
  const t=tractor,qx=t.x-Math.sin(t.a)*.6*u,qy=t.y+Math.cos(t.a)*.6*u;
  for(let l=-.4*u;l<=.4*u;l+=cell*.5){
    const i=cellOf(qx+Math.cos(t.a)*l,qy+Math.sin(t.a)*l),c=i>=0&&cropAt[i];
    if(c){
      const age=clock-c.t0;
      if(age>=c.g&&age<c.g+15){
        crops.splice(crops.indexOf(c),1);cropAt[i]=null;tilledA[i]=0;
        tg.clearRect(F.x+c.cx*cell,F.y+c.cy*cell,cell,cell);load[c.type]++;hudUpdate();
      }
    }
  }
}
function tillAt(mv){
  const t=tractor,x=t.x-Math.sin(t.a)*.58*u,y=t.y+Math.cos(t.a)*.58*u,len=mv+2;
  for(let l=-.36*u;l<=.36*u;l+=cell*.5)mark(x+Math.cos(t.a)*l,y+Math.sin(t.a)*l);
  tg.save();tg.translate(x,y);tg.rotate(t.a);
  tg.fillStyle='#4e2f15';tg.fillRect(-.36*u,-len/2,.72*u,len);
  tg.fillStyle='#6b4423';for(let i=0;i<3;i++)tg.fillRect((Math.random()-.5)*.7*u,(Math.random()-.5)*len,2,2);
  tg.restore();
}
function update(dt){
  pulse+=dt;clock+=dt;updateCrops();updateSeason(dt);if(menuOpen||!target)return;
  const t=tractor,dx=target.x-t.x,dy=target.y-t.y,d=Math.hypot(dx,dy);
  if(d<5){target=null;return}
  const want=Math.atan2(dx,-dy);
  let diff=Math.atan2(Math.sin(want-t.a),Math.cos(want-t.a));
  const turn=3.5*dt;
  t.a+=Math.abs(diff)<turn?diff:Math.sign(diff)*turn;
  diff=Math.atan2(Math.sin(want-t.a),Math.cos(want-t.a));
  const al=Math.cos(diff);
  if(al>0.3){
    const sp=Math.min(u*3.2*al,d/dt);
    const px=t.x,py=t.y;t.x+=Math.sin(t.a)*sp*dt;t.y-=Math.cos(t.a)*sp*dt;collide(t);
    const mv=Math.hypot(t.x-px,t.y-py);t.wr+=mv;if(mv>0&&season!==3){if(attach==='tiller')tillAt(mv);else if(attach==='drill'&&seed)plantAt();else if(attach==='harvest')harvestAt()}
    stall=mv<sp*dt*.3?stall+dt:0;if(stall>.5){target=null;stall=0}
  }
}

let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  update(dt);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(fade<1){ctx.drawImage(bgs[prevS],0,0,W,H);ctx.globalAlpha=fade}
  ctx.drawImage(bgs[season],0,0,W,H);ctx.globalAlpha=1;
  ctx.drawImage(till,0,0,W,H);drawCrops();drawSnow();drawMill();drawTarget();drawTractor();drawSails();drawFx();drawParts(dt);checkBarn();checkStore();checkFood();
  requestAnimationFrame(frame);
}

cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  target={x:Math.max(bounds.x0,Math.min(bounds.x1,e.clientX)),y:Math.max(bounds.y0,Math.min(bounds.y1,e.clientY))};
  document.getElementById('hint').style.opacity=0;
});
addEventListener('resize',()=>{const rx=tractor.x/(W||1),ry=tractor.y/(H||1);build();tractor.x=rx*W;tractor.y=ry*H;target=null});
const menu=document.getElementById('menu'),bAtt=document.getElementById('bAtt'),bRem=document.getElementById('bRem');
function refreshMenu(){bAtt.textContent=attach==='tiller'?'Tiller attached':'Attach tiller';bAtt.disabled=attach==='tiller';bSeed.textContent=attach==='drill'?'Seed drill attached':'Attach seed drill';bSeed.disabled=attach==='drill';bHarv.textContent=attach==='harvest'?'Harvester attached':'Attach harvester';bHarv.disabled=attach==='harvest';bRem.disabled=!attach}
function openMenu(){menuOpen=true;target=null;refreshMenu();barnCard.style.display='flex';storeCard.style.display='none';menu.style.display='flex'}
function closeMenu(){menuOpen=false;menu.style.display='none';for(const k of[barnCard,storeCard,statusCard,gameCard])k.style.display='none'}
const bSeed=document.getElementById('bSeed'),bHarv=document.getElementById('bHarv'),hudEl=document.getElementById('hud');
bAtt.onclick=()=>{attach='tiller';seed=null;refreshMenu()};
bSeed.onclick=()=>{attach='drill';refreshMenu()};
bHarv.onclick=()=>{attach='harvest';seed=null;refreshMenu()};
bRem.onclick=()=>{attach=null;seed=null;refreshMenu()};
document.getElementById('bClose').onclick=closeMenu;
menu.addEventListener('pointerdown',e=>{if(e.target===menu)closeMenu()});
const barnCard=document.getElementById('barnCard'),storeCard=document.getElementById('storeCard'),bPot=document.getElementById('bPot'),bPum=document.getElementById('bPum'),bClr=document.getElementById('bClr');
function refreshStore(){bPot.textContent=seed==='potato'?'Potatoes selected':'Potatoes';bPot.disabled=seed==='potato';bPum.textContent=seed==='pumpkin'?'Pumpkins selected':'Pumpkins';bPum.disabled=seed==='pumpkin';bClr.disabled=!seed}
function openStore(){menuOpen=true;target=null;refreshStore();barnCard.style.display='none';storeCard.style.display='flex';menu.style.display='flex'}
bPot.onclick=()=>{seed='potato';refreshStore()};
bPum.onclick=()=>{seed='pumpkin';refreshStore()};
bClr.onclick=()=>{seed=null;refreshStore()};
document.getElementById('bSClose').onclick=closeMenu;
function toast(msg){const h=document.getElementById('hint');h.textContent=msg;h.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>{h.style.opacity=0},2800)}
let inStore=false;
function checkStore(){const s=store,t=tractor,i=t.x>s.x+s.wt&&t.x<s.x+s.w-s.wt&&t.y>s.y+u*.55&&t.y<s.y+s.h;if(i&&!inStore){if(attach==='drill')openStore();else toast('Fit the seed drill at the barn to load seed')}inStore=i}
let inFood=false;
function checkFood(){
  const s=food,t=tractor,i=t.x>s.x+s.wt&&t.x<s.x+s.w-s.wt&&t.y>s.y+u*.55&&t.y<s.y+s.h;
  if(i&&!inFood&&load.potato+load.pumpkin>0){
    let j0=0;for(const ty of['potato','pumpkin']){const n=load[ty];if(!n)continue;const k=Math.min(n,10);for(let j=0;j<k;j++)fxs.push({x:t.x,y:t.y,ty,dx:(Math.random()-.5)*50,t0:clock+(j0++)*.07,life:1.2});fxs.push({x:s.x+s.w/2,y:s.y-6-(ty==='pumpkin'?24:0),t0:clock,life:1.5,txt:'+'+n+(ty==='pumpkin'?' 🎃':' 🥔')});stored[ty]+=n;load[ty]=0}hudUpdate();
    
    
    
  }
  inFood=i;
}
const statusCard=document.getElementById('statusCard'),gameCard=document.getElementById('gameCard'),stCar=document.getElementById('stCar'),stSto=document.getElementById('stSto'),seasonsChk=document.getElementById('seasonsOn'),bReset=document.getElementById('bReset');
function openCard(c){menuOpen=true;for(const k of[barnCard,storeCard,statusCard,gameCard])k.style.display=k===c?'flex':'none';menu.style.display='flex'}
hudEl.onclick=()=>{hudUpdate();openCard(statusCard)};
document.getElementById('mbtn').onclick=()=>openCard(gameCard);
document.getElementById('stX').onclick=closeMenu;
document.getElementById('gmX').onclick=closeMenu;
seasonsChk.onchange=()=>{seasonsOn=seasonsChk.checked;if(!seasonsOn&&season!==1){prevS=season;season=1;fade=0}seasonT=0;seasonDur=seasonLen(season)};
function resetField(){tilledA.fill(0);cropAt.fill(null);crops=[];tg.clearRect(0,0,W,H)}
let rc=0;
bReset.onclick=()=>{
  if(!rc){bReset.textContent='Tap again to confirm';rc=setTimeout(()=>{rc=0;bReset.textContent='Reset field'},3000);return}
  clearTimeout(rc);rc=0;bReset.textContent='Reset field';resetField();
};
let inBarn=false;
function checkBarn(){const t=tractor,i=t.x>barn.x+barn.wt&&t.x<barn.x+barn.w-barn.wt&&t.y>barn.y+u*.55&&t.y<barn.y+barn.h;if(i&&!inBarn)openMenu();inBarn=i}
build();tractor.x=W/2;tractor.y=fieldH*.78;
requestAnimationFrame(frame);
